<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Lawyers // Legal Intelligence Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#03060a;
  --panel:#070d14;
  --panel2:#0b1420;
  --line: rgba(76,214,255,0.18);
  --line-strong: rgba(76,214,255,0.45);
  --cyan:#4cd6ff;
  --cyan-soft:#8ee9ff;
  --cyan-dim:#1a3f4d;
  --amber:#ffb648;
  --red:#ff5c5c;
  --green:#5dffb0;
  --text:#dbe9f0;
  --text-dim:#7d97a3;
  --text-faint:#4a6068;
  --disp: 'Orbitron', sans-serif;
  --mono: 'Share Tech Mono', monospace;
  --body: 'Rajdhani', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

/* ============ BACKDROP ============ */
#backdrop{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 18% 12%, rgba(76,214,255,0.07), transparent 45%),
    radial-gradient(ellipse at 85% 88%, rgba(255,182,72,0.05), transparent 40%),
    var(--bg);
}
#backdrop::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  opacity:0.12;
}
#backdrop::after{
  content:"";
  position:absolute; inset:0;
  background:repeating-linear-gradient(0deg, rgba(76,214,255,0.025) 0px, rgba(76,214,255,0.025) 1px, transparent 1px, transparent 3px);
  animation:scan 9s linear infinite;
}
@keyframes scan{ 0%{transform:translateY(0);} 100%{transform:translateY(64px);} }

.corner-ring{position:fixed; z-index:0; pointer-events:none; opacity:0.35;}
.corner-ring svg{width:340px; height:340px;}
.cr-tl{top:-140px; left:-140px;}
.cr-br{bottom:-160px; right:-160px;}

/* ============ BOOT OVERLAY ============ */
#boot{
  position:fixed; inset:0; z-index:100; background:#020406;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity 0.8s ease;
}
#boot.hide{opacity:0; pointer-events:none;}
.boot-ring{width:140px; height:140px; position:relative; margin-bottom:28px;}
.boot-ring svg{width:100%; height:100%;}
.boot-ring circle.track{fill:none; stroke:rgba(76,214,255,0.12); stroke-width:2;}
.boot-ring circle.sweep{fill:none; stroke:var(--cyan); stroke-width:2; stroke-linecap:round;
  stroke-dasharray:377; stroke-dashoffset:377; animation:sweep 1.6s ease-in-out forwards;}
@keyframes sweep{ to{stroke-dashoffset:40;} }
.boot-core{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-size:11px; letter-spacing:2px; color:var(--cyan);}
#boot-log{font-family:var(--mono); font-size:12px; color:var(--text-dim); letter-spacing:1px; min-height:20px;}
#boot-title{font-family:var(--disp); font-size:15px; letter-spacing:5px; color:var(--cyan-soft); margin-bottom:4px;}
#boot-subtitle{font-family:var(--mono); font-size:9px; letter-spacing:3px; color:var(--text-faint); margin-bottom:22px;}

/* ============ SHELL LAYOUT ============ */
#shell{position:relative; z-index:1; height:100vh; display:grid; grid-template-columns:76px 1fr; grid-template-rows:64px 1fr 52px;}

/* header */
#topbar{
  grid-column:1/3; grid-row:1;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px 0 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(11,20,32,0.7), rgba(11,20,32,0.2));
  backdrop-filter:blur(6px);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{width:30px; height:30px; position:relative;}
.brand-mark svg{width:100%; height:100%;}
.brand-text{font-family:var(--disp); font-size:12px; letter-spacing:2px; color:var(--cyan-soft); white-space:nowrap;}
.brand-sub{font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:1px; margin-top:1px;}
.topbar-right{display:flex; align-items:center; gap:22px;}
.clock{font-family:var(--mono); font-size:12px; color:var(--text-dim); letter-spacing:1px;}
.charge{display:flex; align-items:center; gap:10px;}
.charge-ring{width:34px; height:34px; position:relative;}
.charge-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.charge-ring .track{fill:none; stroke:rgba(76,214,255,0.15); stroke-width:3;}
.charge-ring .fill{fill:none; stroke:var(--cyan); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset 0.5s ease;}
.charge-label{font-family:var(--mono); font-size:10px; color:var(--text-dim);}

/* left rail */
#rail{
  grid-column:1; grid-row:2/4;
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center;
  padding:20px 0; gap:6px; overflow-y:auto;
  background:rgba(7,13,20,0.4);
}
.rail-group-label{font-family:var(--mono); font-size:8px; color:var(--text-faint); letter-spacing:2px; writing-mode:vertical-rl; margin:8px 0;}
.rail-dot{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10px; color:var(--text-faint);
  cursor:pointer; transition:all 0.25s ease; flex-shrink:0; position:relative; background:rgba(11,20,32,0.5);
}
.rail-dot:hover{border-color:var(--line-strong); color:var(--cyan-soft);}
.rail-dot.active{border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 14px rgba(76,214,255,0.4); background:rgba(76,214,255,0.08);}
.rail-dot.done::after{content:""; position:absolute; bottom:-1px; right:-1px; width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}
.rail-sep{width:26px; height:1px; background:var(--line); margin:4px 0;}

/* stage */
#stage{grid-column:2; grid-row:2; position:relative; overflow:hidden;}
.slide{
  position:absolute; inset:0; padding:38px 56px 30px 56px;
  opacity:0; transform:translateX(24px) scale(0.99); pointer-events:none;
  transition:opacity 0.5s cubic-bezier(.2,.8,.2,1), transform 0.5s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;
}
.slide.active{opacity:1; transform:translateX(0) scale(1); pointer-events:auto;}
.slide::-webkit-scrollbar{width:6px;}
.slide::-webkit-scrollbar-thumb{background:var(--cyan-dim); border-radius:3px;}

.frame-corner{position:absolute; width:22px; height:22px; border:2px solid var(--line-strong); opacity:0.6; pointer-events:none;}
.fc-tl{top:14px; left:20px; border-right:none; border-bottom:none;}
.fc-tr{top:14px; right:20px; border-left:none; border-bottom:none;}
.fc-bl{bottom:8px; left:20px; border-right:none; border-top:none;}
.fc-br{bottom:8px; right:20px; border-left:none; border-top:none;}

.eyebrow{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:3px; display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.eyebrow::before{content:""; width:20px; height:1px; background:var(--amber);}
h1.slide-title{font-family:var(--disp); font-weight:700; font-size:clamp(24px,3.2vw,42px); color:#f2f9fc; letter-spacing:1px; line-height:1.15; max-width:920px;}
h1.slide-title .accent{color:var(--cyan);}
.slide-kicker{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:10px; max-width:760px; line-height:1.6;}

.panel{
  background:linear-gradient(155deg, rgba(15,23,32,0.85), rgba(9,15,22,0.85));
  border:1px solid var(--line); border-radius:2px; padding:20px 22px; position:relative;
}
.panel::before{content:""; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--cyan-dim);}
.panel.warn::before{background:var(--red);}
.panel.gold::before{background:var(--amber);}
.panel-label{font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--cyan-soft); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.panel-label .dot{width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan);}
.panel p, .panel li{font-family:var(--body); font-size:16px; line-height:1.55; color:var(--text);}
.panel li{margin-bottom:8px;}
.panel ul{padding-left:18px;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:22px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:22px;}
@media (max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}}

.tag{display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:1.5px; color:var(--cyan-soft); border:1px solid var(--cyan-dim); padding:3px 9px; border-radius:20px; margin:0 6px 6px 0;}
.case-cite{font-family:var(--mono); font-size:13px; color:var(--amber); border-left:2px solid var(--amber); padding-left:10px; margin:8px 0;}

/* Ratio / Obiter twin panels */
.rd-panel{border:1px solid var(--cyan); background:rgba(76,214,255,0.05); position:relative;}
.rd-panel::before{background:var(--cyan);}
.rd-panel .panel-label{color:var(--cyan);}
.ob-panel{border:1px dashed var(--text-faint); background:rgba(255,255,255,0.015);}
.ob-panel::before{background:transparent; border-left:3px dashed var(--text-faint);}
.ob-panel .panel-label{color:var(--text-dim);}

/* verdict */
.verdict-strip{margin-top:20px; padding:16px 20px; border:1px solid var(--line-strong); background:rgba(76,214,255,0.06); display:flex; gap:16px; align-items:flex-start; border-radius:2px;}
.verdict-strip .vlabel{font-family:var(--disp); font-size:11px; letter-spacing:2px; color:var(--cyan); flex-shrink:0; padding-top:2px;}

/* progress footer */
#footer{grid-column:2; grid-row:3; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 30px; background:rgba(7,13,20,0.5);}
.nav-btn{font-family:var(--mono); font-size:11px; letter-spacing:1.5px; color:var(--text-dim); background:transparent; border:1px solid var(--line); padding:8px 16px; cursor:pointer; transition:all 0.2s; border-radius:2px;}
.nav-btn:hover:not(:disabled){color:var(--cyan); border-color:var(--cyan);}
.nav-btn:disabled{opacity:0.25; cursor:default;}
.counter{font-family:var(--mono); font-size:11px; color:var(--text-dim); letter-spacing:2px;}
.counter b{color:var(--cyan-soft);}
#progress-track{flex:1; height:2px; background:rgba(76,214,255,0.12); margin:0 24px; position:relative; overflow:hidden;}
#progress-fill{height:100%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); transition:width 0.4s ease;}

/* reference list */
.ref-block{margin-bottom:18px;}
.ref-block h3{font-family:var(--disp); font-size:13px; letter-spacing:2px; color:var(--amber); margin-bottom:10px;}
.ref-item{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); line-height:1.9; border-bottom:1px solid rgba(76,214,255,0.08); padding:6px 0;}
.ref-item b{color:var(--text);}

/* hint */
#hint{position:fixed; bottom:64px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:1px; z-index:5; opacity:0; transition:opacity 0.4s; pointer-events:none;}
#hint.show{opacity:0.8;}

@media (max-width:900px){
  #shell{grid-template-columns:56px 1fr;}
  #rail{padding:14px 0;}
  .rail-dot{width:30px; height:30px; font-size:9px;}
  .slide{padding:70px 20px 20px 20px;}
  h1.slide-title{font-size:22px;}
}
</style>
</head>
<body>

<div id="backdrop"></div>
<div class="corner-ring cr-tl"><svg viewBox="0 0 340 340"><circle cx="170" cy="170" r="160" fill="none" stroke="#4cd6ff" stroke-width="1" stroke-dasharray="4 10"/><circle cx="170" cy="170" r="120" fill="none" stroke="#4cd6ff" stroke-width="1"/></svg></div>
<div class="corner-ring cr-br"><svg viewBox="0 0 340 340"><circle cx="170" cy="170" r="160" fill="none" stroke="#ffb648" stroke-width="1" stroke-dasharray="2 8"/><circle cx="170" cy="170" r="110" fill="none" stroke="#ffb648" stroke-width="1"/></svg></div>

<!-- BOOT SEQUENCE -->
<div id="boot">
  <div id="boot-title">INTERACTIVE LAWYERS</div>
  <div id="boot-subtitle">LEGAL INTELLIGENCE INTERFACE</div>
  <div class="boot-ring">
    <svg viewBox="0 0 130 130">
      <circle class="track" cx="65" cy="65" r="60"/>
      <circle class="sweep" cx="65" cy="65" r="60" transform="rotate(-90 65 65)"/>
    </svg>
    <div class="boot-core">I.L</div>
  </div>
  <div id="boot-log">initializing case files…</div>
</div>

<!-- SHELL -->
<div id="shell">
  <div id="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="#4cd6ff" stroke-width="1.4"/><circle cx="15" cy="15" r="7" fill="none" stroke="#4cd6ff" stroke-width="1.4"/><circle cx="15" cy="15" r="2.4" fill="#4cd6ff"/></svg></div>
      <div>
        <div class="brand-text">INTERACTIVE LAWYERS</div>
        <div class="brand-sub">CONSTITUTIONAL ANALYSIS INTERFACE · IN</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="charge">
        <div class="charge-ring">
          <svg viewBox="0 0 36 36">
            <circle class="track" cx="18" cy="18" r="15"/>
            <circle class="fill" id="charge-fill" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="94.2"/>
          </svg>
        </div>
        <div class="charge-label">DECK<br><span id="charge-pct">0%</span></div>
      </div>
    </div>
  </div>

  <div id="rail"></div>

  <div id="stage"></div>

  <div id="footer">
    <button class="nav-btn" id="prevBtn">◄ PREV</button>
    <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
    <div class="counter"><b id="curNum">01</b> / <span id="totNum">18</span></div>
    <button class="nav-btn" id="nextBtn" style="margin-left:20px;">NEXT ►</button>
  </div>
</div>

<div id="hint">◄ ► ARROW KEYS  ·  SPACE  ·  CLICK RAIL TO JUMP</div>

<script>
/* =========================================================
   SLIDE DATA
   ========================================================= */
const slides = [

// ---------- 0: TITLE ----------
{
  section:"INTRO", railLabel:"00",
  render:()=>`
    <div class="frame-corner fc-tl"></div><div class="frame-corner fc-tr"></div><div class="frame-corner fc-bl"></div><div class="frame-corner fc-br"></div>
    <div style="height:100%; display:flex; flex-direction:column; justify-content:center; max-width:980px;">
      <div class="eyebrow">CASE FILE INDEX · INDIAN CONSTITUTIONAL &amp; LABOUR LAW</div>
      <h1 class="slide-title" style="font-size:clamp(30px,4.4vw,58px);">Right, Duty &amp; the <span class="accent">Digital Age</span><br>— Three Case Analyses</h1>
      <p class="slide-kicker" style="font-size:14px; margin-top:18px; max-width:680px;">A structured ratio decidendi / obiter dicta analysis of three contemporary Indian legal scenarios — privacy &amp; biometrics, environmental clearance, and the right to disconnect — built on Supreme Court precedent and current legislation.</p>
      <div style="display:flex; gap:14px; margin-top:34px; flex-wrap:wrap;">
        <div class="tag">ARTICLE 21</div><div class="tag">PUTTASWAMY (2017)</div><div class="tag">VELLORE CITIZENS (1996)</div><div class="tag">SAMATHA (1997)</div><div class="tag">RIGHT TO DISCONNECT BILL 2025</div>
      </div>
      <div style="margin-top:40px; font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:1px;">PRESS ► OR CLICK "NEXT" TO BEGIN BRIEFING</div>
      <div style="margin-top:54px; font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:2px;">A PRODUCTION OF <span style="color:var(--cyan-soft);">INTERACTIVE LAWYERS</span></div>
    </div>`
},

// ---------- CASE 1 : FACTS ----------
{
  section:"CASE 01 · PRIVACY", railLabel:"1.1",
  render:()=>`
    <div class="frame-corner fc-tl"></div><div class="frame-corner fc-tr"></div>
    <div class="eyebrow">CASE 01 · RIGHT TO PRIVACY v. PUBLIC WELFARE ADMINISTRATION</div>
    <h1 class="slide-title">Compulsory Biometric Enrolment for Welfare Schemes</h1>
    <div class="grid2">
      <div class="panel">
        <div class="panel-label"><span class="dot"></span>FACT PATTERN</div>
        <p>A State Government mandates facial-recognition scans and fingerprints as a condition for accessing government welfare schemes, citing the need to prevent fraud and eliminate duplicate beneficiaries. A civil society organisation challenges the rule, arguing that <b>compulsory collection</b> and <b>indefinite storage</b> of biometric data violates the fundamental right to privacy.</p>
      </div>
      <div class="panel warn">
        <div class="panel-label" style="color:var(--red);"><span class="dot" style="background:var(--red); box-shadow:0 0 6px var(--red);"></span>CONTESTED ISSUES</div>
        <ul>
          <li>Is the right to privacy a free-standing fundamental right capable of being asserted against welfare-linked data collection?</li>
          <li>Does mandatory biometric capture satisfy the constitutional tests for restricting privacy?</li>
          <li>Is <i>indefinite</i> retention of biometric data constitutionally permissible?</li>
        </ul>
      </div>
    </div>
    <div class="grid3">
      <div class="panel"><div class="panel-label">STATE'S POSITION</div><p style="font-size:14.5px;">Legitimate state interest in preventing leakage of subsidies; biometric de-duplication rationally connected to accurate targeting of welfare (Art. 41, 39(b) DPSP).</p></div>
      <div class="panel"><div class="panel-label">PETITIONER'S POSITION</div><p style="font-size:14.5px;">Biometric data is uniquely sensitive and immutable; indefinite storage without a sunset clause fails the proportionality standard and invites function creep / surveillance risk.</p></div>
      <div class="panel"><div class="panel-label">GOVERNING PROVISIONS</div><p style="font-size:14.5px;">Constitution: Arts. 14, 19, 21, 39(b), 41 · Aadhaar Act, 2016 · Digital Personal Data Protection Act, 2023</p></div>
    </div>`
},

// ---------- CASE 1 : PRECEDENT / RATIO / OBITER ----------
{
  section:"CASE 01 · PRIVACY", railLabel:"1.2",
  render:()=>`
    <div class="frame-corner fc-tl"></div><div class="frame-corner fc-tr"></div>
    <div class="eyebrow">GOVERNING PRECEDENT</div>
    <h1 class="slide-title">K.S. Puttaswamy v. Union of India</h1>
    <div class="case-cite">(2017) 10 SCC 1 — 9-Judge Bench, Supreme Court of India · &amp; Puttaswamy (Aadhaar-5J), (2019) 1 SCC 1</div>
    <div class="grid2">
      <div class="panel rd-panel">
        <div class="panel-label">RATIO DECIDENDI</div>
        <ul>
          <li>Privacy is intrinsic to <b>Article 21</b>, and flows also from Arts. 14 &amp; 19 — overruling <i>M.P. Sharma</i> and <i>Kharak Singh</i>.</li>
          <li>Any restriction on privacy must clear a <b>three-fold test</b>: (i) existence of law, (ii) a legitimate state aim, (iii) proportionality — a rational nexus and the least intrusive means available.</li>
          <li>In the Aadhaar judgment, welfare-linked biometric authentication was upheld (4:1) as serving a legitimate distributive-justice aim, <b>but</b> the Court struck Section 57 (private use) and read down indefinite retention — holding that data kept beyond what authentication requires is disproportionate.</li>
        </ul>
      </div>
      <div class="panel ob-panel">
        <div class="panel-label">OBITER DICTA</div>
        <ul>
          <li>Chandrachud J. described privacy as inseparable from human dignity and "informational self-determination" — control over one's own data footprint.</li>
          <li>Kaul J.'s concurrence urged Parliament to enact a comprehensive data-protection statute — an observation that anticipated the later Digital Personal Data Protection Act, 2023.</li>
          <li>Passing remarks recognised a nascent "right to be forgotten" as a facet of informational privacy, though not conclusively adjudicated.</li>
        </ul>
      </div>
    </div>
    <div class="verdict-strip">
      <div class="vlabel">APPLIED<br>OUTCOME</div>
      <p>Collection of biometric data for welfare de-duplication is likely to survive the "legitimate aim" and "rational nexus" limbs. The rule's vulnerability lies squarely in the word <b>"indefinite"</b> — absent a defined retention period, purpose limitation, and security safeguards under the DPDP Act, 2023, the storage clause fails proportionality and would likely be read down or struck, while the collection mechanism itself is upheld subject to conditions.</p>
    </div>`
},

// ---------- CASE 2 : FACTS ----------
{
  section:"CASE 02 · ENVIRONMENT", railLabel:"2.1",
  render:()=>`
    <div class="frame-corner fc-tl"></div><div class="frame-corner fc-tr"></div>
    <div class="eyebrow">CASE 02 · ENVIRONMENTAL CLEARANCE v. DEVELOPMENTAL IMPERATIVE</div>
    <h1 class="slide-title">Mining Clearance Near Forest &amp; Tribal Land</h1>
    <div class="grid2">
      <div class="panel">
        <div class="panel-label"><span class="dot"></span>FACT PATTERN</div>
        <p>A State Government clears a large mining project bordering forest land. The company secures environmental clearance, but local residents allege the Environmental Impact Assessment (EIA) inadequately studied effects on <b>groundwater</b>, <b>wildlife</b>, and <b>tribal communities</b>. The company counters that the project generates employment and significant state revenue.</p>
      </div>
      <div class="panel warn">
        <div class="panel-label" style="color:var(--red);"><span class="dot" style="background:var(--red); box-shadow:0 0 6px var(--red);"></span>CONTESTED ISSUES</div>
        <ul>
          <li>Was the EIA a substantive assessment or a procedural formality?</li>
          <li>Does the precautionary principle require re-assessment before clearance stands?</li>
          <li>Were tribal / Gram Sabha consent requirements under the Fifth Schedule and forest law observed?</li>
          <li>How is "sustainable development" balanced against economic development claims?</li>

/* =========================================================
   ENGINE
   ========================================================= */
const stage = document.getElementById('stage');
const rail = document.getElementById('rail');
let current = 0;

function buildRail(){
  let lastSection = null;
  slides.forEach((s,i)=>{
    if(s.section !== lastSection){
      const lab = document.createElement('div');
      lab.className='rail-group-label';
      lab.textContent = s.section;
      rail.appendChild(lab);
      lastSection = s.section;
    }
    const d = document.createElement('div');
    d.className='rail-dot';
    d.textContent = s.railLabel;
    d.dataset.index = i;
    d.addEventListener('click', ()=>goTo(i));
    rail.appendChild(d);
  });
}

function renderSlides(){
  stage.innerHTML = slides.map((s,i)=>`<div class="slide" data-i="${i}">${s.render()}</div>`).join('');
}

function goTo(i){
  if(i<0 || i>=slides.length) return;
  current = i;
  document.querySelectorAll('.slide').forEach(el=>{
    el.classList.toggle('active', +el.dataset.i === i);
    if(+el.dataset.i === i) el.scrollTop = 0;
  });
  document.querySelectorAll('.rail-dot').forEach(el=>{
    const idx = +el.dataset.index;
    el.classList.toggle('active', idx===i);
    if(idx < i) el.classList.add('done'); else if(idx>i) el.classList.remove('done');
  });
  document.getElementById('curNum').textContent = String(i+1).padStart(2,'0');
  const pct = Math.round(((i+1)/slides.length)*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  const circ = 94.2;
  document.getElementById('charge-fill').style.strokeDashoffset = circ - (circ*pct/100);
  document.getElementById('charge-pct').textContent = pct+'%';
  document.getElementById('prevBtn').disabled = i===0;
  document.getElementById('nextBtn').disabled = i===slides.length-1;
}

document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); goTo(current+1); }
  if(e.key==='ArrowLeft'){ goTo(current-1); }
});

document.getElementById('totNum').textContent = String(slides.length).padStart(2,'0');
buildRail();
renderSlides();
goTo(0);

// hint fade
setTimeout(()=>document.getElementById('hint').classList.add('show'), 2600);
setTimeout(()=>document.getElementById('hint').classList.remove('show'), 7500);

// clock
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toTimeString().split(' ')[0];
}
tick(); setInterval(tick,1000);

// boot sequence
const bootLogs = ["initializing case files…","loading constitutional index…","cross-referencing precedent…","rendering interface…","ready."];
let bl = 0;
const blEl = document.getElementById('boot-log');
const blInt = setInterval(()=>{
  bl++;
  if(bl < bootLogs.length){ blEl.textContent = bootLogs[bl]; }
}, 340);
setTimeout(()=>{
  clearInterval(blInt);
  document.getElementById('boot').classList.add('hide');
}, 1900);
</script>
